<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final leaderboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .leaderboard { margin: 30px 0; }
        .leaderboard-item { 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            padding: 15px; 
            background: #f9f9f9; 
            margin: 10px 0; 
            border-radius: 3px;
            border-left: 4px solid #4c51bf;
        }
        .rank { font-weight: bold; color: #666; min-width: 30px; }
        .leaderboard-item.winner { background: #fff3cd; border-left-color: #ffc107; }
        .player-info { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        .player-avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #4c51bf 0%, #764ba2 100%); 
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
        }
        .player-name { font-weight: bold; color: #333; }
        .score { color: #4c51bf; font-size: 18px; font-weight: bold; }
        .medal { font-size: 24px; margin-right: 10px; }
        .btn { 
            padding: 10px 20px; 
            margin: 10px 5px; 
            font-size: 14px; 
            cursor: pointer;
            background: #4c51bf;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .btn:hover { background: #764ba2; }
        .button-group { text-align: center; margin-top: 30px; }
    </style>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container" role="main">
        <h1>🎉 Quiz Complete!</h1>
        <h2 style="text-align: center; color: #4c51bf;">Final Leaderboard</h2>
        
        <div class="leaderboard" id="leaderboard">
            <p style="text-align: center;">Loading results...</p>
        </div>
        
        <div class="button-group">
            <button class="btn" onclick="playAgain()">Play Another Round</button>
            <button class="btn" onclick="goHome()">Go Home</button>
        </div>
    </div>

    <script>
        const gameId = "{{ game_id }}";
        const socket = io();
        // Players already sorted and ranked by the server; tied players share a rank.
        const ranked = {{ ranked | tojson }};
        
        function showMessage(container, text) {
            const p = document.createElement("p");
            p.style.textAlign = "center";
            p.textContent = text;
            container.replaceChildren(p);
        }

        function displayResults() {
            const leaderboard = document.getElementById("leaderboard");

            if (!ranked || ranked.length === 0) {
                showMessage(leaderboard, "Error loading results. Please try again.");
                return;
            }

            const medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
            const avatarEmojis = ["🎯", "⭐", "🚀", "💎", "🔥", "👑", "🎪", "🌟"];
            const playersPerRank = {};
            ranked.forEach((p) => { playersPerRank[p.rank] = (playersPerRank[p.rank] || 0) + 1; });

            leaderboard.replaceChildren();

            // Build each row with textContent so player names show as plain
            // text, even if they contain HTML or script (prevents XSS).
            ranked.forEach((player, index) => {
                const isTie = playersPerRank[player.rank] > 1;

                const item = document.createElement("div");
                item.className = "leaderboard-item" + (player.rank === 1 ? " winner" : "");

                const medal = document.createElement("span");
                medal.className = "medal";
                medal.textContent = medals[player.rank] || "";

                const rank = document.createElement("span");
                rank.className = "rank";
                rank.textContent = (isTie ? "Joint #" : "#") + player.rank;

                const info = document.createElement("div");
                info.className = "player-info";
                const avatar = document.createElement("div");
                avatar.className = "player-avatar";
                avatar.textContent = avatarEmojis[index % avatarEmojis.length];
                const name = document.createElement("span");
                name.className = "player-name";
                name.textContent = player.name + (player.rank === 1 ? " (winner)" : "");
                info.append(avatar, name);

                const score = document.createElement("span");
                score.className = "score";
                score.textContent = player.score + (player.score === 1 ? " point" : " points");

                item.append(medal, rank, info, score);
                leaderboard.appendChild(item);
            });
        }
        
        function playAgain() {
            // Create new game
            socket.emit("create_game", { player_name: sessionStorage.getItem("playerName") || "Player" });
            socket.on("game_created", function(data) {
                window.location.href = "/lobby/" + data.game_id;
            });
        }
        
        function goHome() {
            window.location.href = "/";
        }
        
        displayResults();
    </script>
</body>
</html>
